name: Verify release portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Release regression tests
        run: python -m unittest discover -s code/tests -v
      - name: Full artifact verifier
        run: python code/verify_results.py
      - name: Completed CPU evidence verifier
        run: python code/verify_completed_cpu.py
